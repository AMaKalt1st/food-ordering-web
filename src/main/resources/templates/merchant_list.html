<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商家管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>🏪 商家列表</h2>
    <a href="/merchants/new" class="btn btn-success mb-3">新增商家</a>
    <a href="/" class="btn btn-secondary mb-3">返回首页</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>商家名称</th>
            <th>电话</th>
            <th>评分</th>
            <th>状态</th>
            <th>创建时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${merchants}">
            <td th:text="${m.merchantId}"></td>
            <td th:text="${m.name}"></td>
            <td th:text="${m.phone}"></td>
            <td th:text="${m.rating}"></td>
            <td th:text="${m.status}"></td>
            <td th:text="${m.createdAt}"></td>
            <td>
                <a th:href="@{/merchants/edit/{id}(id=${m.merchantId})}" class="btn btn-sm btn-warning">编辑</a>
                <a th:href="@{/merchants/delete/{id}(id=${m.merchantId})}" class="btn btn-sm btn-danger" onclick="return confirm('确认删除？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
