<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>地址表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${address == null} ? '新增地址' : '编辑地址'"></h2>

    <form th:if="${address == null}" action="/addresses" method="post" class="mt-3">
        <div class="mb-3">
            <label class="form-label">所属用户</label>
            <select class="form-control" name="userId" required>
                <option th:each="u : ${users}" th:value="${u['user_id']}" th:text="${u['nickname']}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">收货人</label>
            <input type="text" class="form-control" name="receiverName" required />
        </div>
        <div class="mb-3">
            <label class="form-label">收货人电话</label>
            <input type="text" class="form-control" name="receiverPhone" required />
        </div>
        <div class="mb-3">
            <label class="form-label">地区</label>
            <input type="text" class="form-control" name="region" placeholder="如：北京市海淀区" required />
        </div>
        <div class="mb-3">
            <label class="form-label">详细地址</label>
            <input type="text" class="form-control" name="detail" placeholder="如：XX街道XX小区X号楼X单元" required />
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" name="isDefault" value="1" />
            <label class="form-check-label">设为默认地址</label>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/addresses" class="btn btn-secondary">返回</a>
    </form>

    <form th:if="${address != null}" action="/addresses/update" method="post" class="mt-3">
        <input type="hidden" name="addressId" th:value="${address['address_id']}" />
        <div class="mb-3">
            <label class="form-label">所属用户</label>
            <select class="form-control" name="userId" required>
                <option th:each="u : ${users}" th:value="${u['user_id']}" th:text="${u['nickname']}"
                        th:selected="${u['user_id'] == address['user_id']}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">收货人</label>
            <input type="text" class="form-control" name="receiverName" th:value="${address['receiver_name']}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">收货人电话</label>
            <input type="text" class="form-control" name="receiverPhone" th:value="${address['receiver_phone']}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">地区</label>
            <input type="text" class="form-control" name="region" th:value="${address['region']}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">详细地址</label>
            <input type="text" class="form-control" name="detail" th:value="${address['detail']}" required />
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" name="isDefault" value="1"
                   th:checked="${address['is_default'] == 1}" />
            <label class="form-check-label">设为默认地址</label>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/addresses" class="btn btn-secondary">返回</a>
    </form>
</div>
</body>
</html>
