<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>地址管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>📍 地址列表</h2>
    <a href="/addresses/new" class="btn btn-success mb-3">新增地址</a>
    <a href="/" class="btn btn-secondary mb-3">返回首页</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>地址ID</th>
            <th>用户</th>
            <th>收货人</th>
            <th>电话</th>
            <th>地区</th>
            <th>详细地址</th>
            <th>默认</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${addresses}">
            <td th:text="${a['address_id']}"></td>
            <td th:text="${a['user_name']}"></td>
            <td th:text="${a['receiver_name']}"></td>
            <td th:text="${a['receiver_phone']}"></td>
            <td th:text="${a['region']}"></td>
            <td th:text="${a['detail']}"></td>
            <td>
                        <span th:text="${a['is_default'] == 1} ? '✅ 是' : '否'"
                              th:class="${a['is_default'] == 1} ? 'text-success' : 'text-muted'">
                        </span>
            </td>
            <td>
                <a th:href="@{/addresses/edit/{id}(id=${a['address_id']})}" class="btn btn-sm btn-warning">编辑</a>
                <a th:href="@{/addresses/delete/{id}(id=${a['address_id']})}" class="btn btn-sm btn-danger" onclick="return confirm('确认删除此地址？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
