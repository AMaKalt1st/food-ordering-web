<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>👤 用户列表</h2>
    <a href="/users/new" class="btn btn-success mb-3">新增用户</a>
    <a href="/" class="btn btn-secondary mb-3">返回首页</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>昵称</th>
            <th>电话</th>
            <th>创建时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.userId}"></td>
            <td th:text="${u.nickname}"></td>
            <td th:text="${u.phone}"></td>
            <td th:text="${u.createdAt}"></td>
            <td>
                <a th:href="@{/users/edit/{id}(id=${u.userId})}" class="btn btn-sm btn-warning">编辑</a>
                <a th:href="@{/users/delete/{id}(id=${u.userId})}" class="btn btn-sm btn-danger" onclick="return confirm('确认删除？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
