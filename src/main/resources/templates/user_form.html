<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${user.userId == null} ? '新增用户' : '编辑用户'"></h2>
    <form th:action="@{/users}" method="post" th:object="${user}">
        <input type="hidden" name="userId" th:value="*{userId}" />
        <div class="mb-3">
            <label class="form-label">昵称</label>
            <input type="text" class="form-control" name="nickname" th:value="*{nickname}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">电话</label>
            <input type="text" class="form-control" name="phone" th:value="*{phone}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">角色</label>
            <select class="form-control" name="role">
                <option value="user" th:selected="*{role == 'user'}">普通用户</option>
                <option value="admin" th:selected="*{role == 'admin'}">管理员</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/users" class="btn btn-secondary">返回</a>
    </form>
</div>
</body>
</html>
