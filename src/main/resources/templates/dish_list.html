<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>菜品管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>🍜 菜品列表</h2>
    <a href="/dishes/new" class="btn btn-success mb-3">新增菜品</a>
    <a href="/" class="btn btn-secondary mb-3">返回首页</a>

    <!-- 搜索表单 -->
    <form class="row g-3 mb-3" action="/dishes/search" method="get">
        <div class="col-auto">
            <input type="text" class="form-control" name="merchantId" placeholder="输入商家ID" th:value="${merchantId}" />
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">按商家查询</button>
            <a href="/dishes" class="btn btn-outline-secondary">显示全部</a>
        </div>
    </form>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>商家ID</th>
            <th>菜品名称</th>
            <th>价格</th>
            <th>上架状态</th>
            <th>创建时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${dishes}">
            <td th:text="${d.dishId}"></td>
            <td th:text="${d.merchantId}"></td>
            <td th:text="${d.name}"></td>
            <td th:text="${d.price}"></td>
            <td th:text="${d.onSale == 1} ? '上架' : '下架'"></td>
            <td th:text="${d.createdAt}"></td>
            <td>
                <a th:href="@{/dishes/edit/{id}(id=${d.dishId})}" class="btn btn-sm btn-warning">编辑</a>
                <a th:href="@{/dishes/delete/{id}(id=${d.dishId})}" class="btn btn-sm btn-danger" onclick="return confirm('确认删除？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
