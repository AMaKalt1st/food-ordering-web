<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>📄 订单详情 #<span th:text="${orderId}"></span></h2>
    <a href="/orders" class="btn btn-secondary mb-3">返回订单列表</a>

    <div class="card mb-4" th:if="${orderInfo != null}">
        <div class="card-header">订单信息</div>
        <div class="card-body">
            <p><strong>订单ID：</strong><span th:text="${orderInfo['order_id']}"></span></p>
            <p><strong>状态：</strong><span th:text="${orderInfo['status']}"></span></p>
            <p><strong>总金额：</strong><span th:text="${orderInfo['total_amount']}"></span></p>
            <p><strong>用户名称：</strong><span th:text="${orderInfo['nickname']}"></span></p>
            <p><strong>用户电话：</strong><span th:text="${orderInfo['phone']}"></span></p>
            <p><strong>商家名称：</strong><span th:text="${orderInfo['merchant_name']}"></span></p>
            <p><strong>收货人：</strong><span th:text="${orderInfo['receiver_name']}"></span></p>
            <p><strong>收货人电话：</strong><span th:text="${orderInfo['receiver_phone']}"></span></p>
            <p><strong>地区：</strong><span th:text="${orderInfo['region']}"></span></p>
            <p><strong>详细地址：</strong><span th:text="${orderInfo['detail']}"></span></p>
            <p><strong>创建时间：</strong><span th:text="${orderInfo['created_at']}"></span></p>
            <p><strong>支付时间：</strong><span th:text="${orderInfo['paid_at']}"></span></p>
        </div>
    </div>

    <div class="card">
        <div class="card-header">订单菜品明细</div>
        <div class="card-body">
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>菜品名称</th>
                    <th>数量</th>
                    <th>单价</th>
                    <th>小计</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${orderItems}">
                    <td th:text="${item['dish_name']}"></td>
                    <td th:text="${item['qty']}"></td>
                    <td th:text="${item['deal_price']}"></td>
                    <td th:text="${item['subtotal']}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
