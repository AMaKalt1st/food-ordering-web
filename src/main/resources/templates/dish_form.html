<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>菜品表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${dish.dishId == null} ? '新增菜品' : '编辑菜品'"></h2>
    <form th:action="@{/dishes}" method="post" th:object="${dish}">
        <input type="hidden" name="dishId" th:value="*{dishId}" />
        <div class="mb-3">
            <label class="form-label">商家ID</label>
            <input type="number" class="form-control" name="merchantId" th:value="*{merchantId}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">菜品名称</label>
            <input type="text" class="form-control" name="name" th:value="*{name}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">价格</label>
            <input type="number" step="0.01" class="form-control" name="price" th:value="*{price}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">上架状态</label>
            <select class="form-control" name="onSale">
                <option value="1" th:selected="*{onSale == 1}">上架</option>
                <option value="0" th:selected="*{onSale == 0}">下架</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/dishes" class="btn btn-secondary">返回</a>
    </form>
</div>
</body>
</html>
