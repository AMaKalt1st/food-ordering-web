<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商家表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${merchant.merchantId == null} ? '新增商家' : '编辑商家'"></h2>
    <form th:action="@{/merchants}" method="post" th:object="${merchant}">
        <input type="hidden" name="merchantId" th:value="*{merchantId}" />
        <div class="mb-3">
            <label class="form-label">商家名称</label>
            <input type="text" class="form-control" name="name" th:value="*{name}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">用户名（用于登录）</label>
            <input type="text" class="form-control" name="username" th:value="*{username}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" class="form-control" name="password" th:value="*{password}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">电话</label>
            <input type="text" class="form-control" name="phone" th:value="*{phone}" required />
        </div>
        <div class="mb-3">
            <label class="form-label">评分</label>
            <input type="number" step="0.1" class="form-control" name="rating" th:value="*{rating}" />
        </div>
        <div class="mb-3">
            <label class="form-label">状态</label>
            <select class="form-control" name="status">
                <option value="active" th:selected="*{status == 'active'}">启用</option>
                <option value="inactive" th:selected="*{status == 'inactive'}">停用</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/merchants" class="btn btn-secondary">返回</a>
    </form>
</div>
</body>
</html>
