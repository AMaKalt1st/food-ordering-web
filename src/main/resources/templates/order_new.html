<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增下单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>🛒 新增下单</h2>
    <a href="/" class="btn btn-secondary mb-3">返回首页</a>

    <form action="/orders/create" method="post">
        <div class="mb-3">
            <label class="form-label">用户</label>
            <select class="form-control" name="userId" required>
                <option th:each="u : ${users}" th:value="${u.userId}" th:text="${u.nickname}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">商家</label>
            <select class="form-control" name="merchantId" required>
                <option th:each="m : ${merchants}" th:value="${m.merchantId}" th:text="${m.name}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">地址</label>
            <select class="form-control" name="addressId" required>
                <option th:each="a : ${addresses}" th:value="${a['address_id']}"
                        th:text="${a['receiver_name']} + ' - ' + ${a['detail']}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">菜品</label>
            <select class="form-control" name="dishId" required>
                <option th:each="d : ${dishes}" th:value="${d.dishId}"
                        th:text="${d.name} + ' (¥' + ${d.price} + ')'"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">数量</label>
            <input type="number" class="form-control" name="qty" value="1" min="1" required />
        </div>
        <div class="mb-3">
            <label class="form-label">支付方式</label>
            <select class="form-control" name="payMethod">
                <option value="微信支付">微信支付</option>
                <option value="支付宝">支付宝</option>
            </select>
            <div class="form-text">注意：当前仅支持微信支付和支付宝</div>
        </div>
        <button type="submit" class="btn btn-success">提交订单</button>
    </form>
</div>
</body>
</html>
