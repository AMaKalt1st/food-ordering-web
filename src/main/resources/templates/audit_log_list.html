<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>审计日志</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>📝 审计日志</h2>
    <a href="/" class="btn btn-secondary mb-3">返回首页</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>日志ID</th>
            <th>时间</th>
            <th>操作类型</th>
            <th>表名</th>
            <th>关联ID</th>
            <th>详情</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="log : ${logs}">
            <td th:text="${log['log_id']}"></td>
            <td th:text="${log['event_time']}"></td>
            <td>
                        <span th:text="${log['event_type']}"
                              th:class="${log['event_type'] == 'INSERT'} ? 'text-success' :
                                       (${log['event_type'] == 'UPDATE'} ? 'text-warning' :
                                       (${log['event_type'] == 'DELETE'} ? 'text-danger' : ''))">
                        </span>
            </td>
            <td th:text="${log['table_name']}"></td>
            <td th:text="${log['ref_id']}"></td>
            <td th:text="${log['detail']}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
